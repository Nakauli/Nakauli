<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Engineering map for Aljun Cursiga</title>
  <desc id="desc">A dark dashboard-style map showing Aljun's path from Java practice to APIs, data, machine learning, and useful software.</desc>
  <defs>
    <style>
      .packet { animation: travel 4.8s ease-in-out infinite; }
      @keyframes travel {
        0% { transform: translateX(0); opacity: .25; }
        12% { opacity: 1; }
        88% { opacity: 1; }
        100% { transform: translateX(880px); opacity: .25; }
      }
    </style>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07131E"/>
      <stop offset="0.55" stop-color="#082532"/>
      <stop offset="1" stop-color="#0A2119"/>
    </linearGradient>
    <linearGradient id="track" x1="130" y1="252" x2="1070" y2="252" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25E0C5"/>
      <stop offset="0.5" stop-color="#34B8FF"/>
      <stop offset="1" stop-color="#F5A524"/>
    </linearGradient>
    <filter id="softDots" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur"/>
    </filter>
  </defs>
  <rect width="1200" height="430" rx="26" fill="url(#panel)"/>
  <rect x="42" y="42" width="1116" height="346" rx="18" stroke="#234B60"/>
  <text x="74" y="88" fill="#25E0C5" font-family="Consolas, monospace" font-size="15" font-weight="700" letter-spacing="2">
    ENGINEERING MAP / LIVE FOCUS
  </text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="74" y="125" width="230" height="150" rx="18" fill="#0A1A26" stroke="#25657A"/>
    <text x="102" y="168" fill="#F5F7FA" font-size="28" font-weight="800">Java</text>
    <text x="102" y="198" fill="#A8D4E6" font-size="17">daily practice</text>
    <text x="102" y="232" fill="#25E0C5" font-size="15" font-family="Consolas, monospace">logic + OOP + DSA</text>
    <rect x="350" y="125" width="230" height="150" rx="18" fill="#0A1A26" stroke="#25657A"/>
    <text x="378" y="168" fill="#F5F7FA" font-size="28" font-weight="800">APIs</text>
    <text x="378" y="198" fill="#A8D4E6" font-size="17">back-end foundations</text>
    <text x="378" y="232" fill="#34B8FF" font-size="15" font-family="Consolas, monospace">auth + routes + data</text>
    <rect x="626" y="125" width="230" height="150" rx="18" fill="#0A1A26" stroke="#25657A"/>
    <text x="654" y="168" fill="#F5F7FA" font-size="28" font-weight="800">Data</text>
    <text x="654" y="198" fill="#A8D4E6" font-size="17">SQL and persistence</text>
    <text x="654" y="232" fill="#25E0C5" font-size="15" font-family="Consolas, monospace">queries + schemas</text>
    <rect x="902" y="125" width="230" height="150" rx="18" fill="#0A1A26" stroke="#25657A"/>
    <text x="930" y="168" fill="#F5F7FA" font-size="28" font-weight="800">ML</text>
    <text x="930" y="198" fill="#A8D4E6" font-size="17">practical models</text>
    <text x="930" y="232" fill="#F5A524" font-size="15" font-family="Consolas, monospace">classify + evaluate</text>
  </g>
  <path d="M160 322H1040" stroke="url(#track)" stroke-width="8" stroke-linecap="round"/>
  <circle class="packet" cx="160" cy="322" r="8" fill="#F5F7FA"/>
  <g filter="url(#softDots)">
    <circle cx="160" cy="322" r="12" fill="#25E0C5"/>
    <circle cx="460" cy="322" r="12" fill="#34B8FF"/>
    <circle cx="740" cy="322" r="12" fill="#25E0C5"/>
    <circle cx="1040" cy="322" r="12" fill="#F5A524"/>
  </g>
  <g font-family="Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1.2">
    <text x="122" y="362" fill="#7EEAD9">PRACTICE</text>
    <text x="414" y="362" fill="#91D6FF">BUILD</text>
    <text x="700" y="362" fill="#7EEAD9">VERIFY</text>
    <text x="988" y="362" fill="#FFD58A">SHIP</text>
  </g>
</svg>
