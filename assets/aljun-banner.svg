<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aljun Cursiga profile banner</title>
  <desc id="desc">Dark technical banner for Aljun Cursiga, focused on software engineering, Java, APIs, and machine learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071019"/>
      <stop offset="0.55" stop-color="#09202B"/>
      <stop offset="1" stop-color="#102A24"/>
    </linearGradient>
    <linearGradient id="line" x1="86" y1="220" x2="660" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25E0C5"/>
      <stop offset="0.58" stop-color="#34B8FF"/>
      <stop offset="1" stop-color="#F5A524"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.15 0 0 0 0 0.9 0 0 0 0 0.78 0 0 0 0.45 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <path d="M86 220H660" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
  <text x="86" y="156" fill="#F5F7FA" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="0">
    ALJUN CURSIGA
  </text>
  <text x="90" y="198" fill="#B7D7E8" font-family="Consolas, monospace" font-size="20" font-weight="600">
    software engineering | java | apis | machine learning
  </text>
</svg>
