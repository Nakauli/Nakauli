    <path d="M52 82H130M188 142H296M130 88L210 88M210 88L258 40" stroke="#34B8FF" stroke-width="3"/>
    <path d="M130 88L78 150H26M188 142L122 212" stroke="#25E0C5" stroke-width="3"/>
    <circle cx="130" cy="28" r="8" fill="#F5A524"/>
    <circle cx="52" cy="82" r="8" fill="#34B8FF"/>
    <circle cx="296" cy="142" r="8" fill="#34B8FF"/>
