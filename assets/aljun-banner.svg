<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aljun Cursiga profile banner</title>
  <desc id="desc">Dark technical banner for Aljun Cursiga, focused on software engineering, Java, APIs, and machine learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071019"/>
      <stop offset="0.55" stop-color="#09202B"/>
      <stop offset="1" stop-color="#102A24"/>
    </linearGradient>
    <linearGradient id="line" x1="86" y1="220" x2="660" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25E0C5"/>
      <stop offset="0.58" stop-color="#34B8FF"/>
      <stop offset="1" stop-color="#F5A524"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.15 0 0 0 0 0.9 0 0 0 0 0.78 0 0 0 0.45 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <g opacity="0.16">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200" stroke="#8ADDE7"/>
    <path d="M80 0V360M160 0V360M240 0V360M320 0V360M400 0V360M480 0V360M560 0V360M640 0V360M720 0V360M800 0V360M880 0V360M960 0V360M1040 0V360M1120 0V360" stroke="#8ADDE7"/>
  </g>
  <rect x="32" y="32" width="1136" height="296" rx="22" stroke="#245266" opacity="0.8"/>
  <g transform="translate(86 76)">
    <rect width="236" height="32" rx="16" fill="#0D3A46" stroke="#23D8C4"/>
    <circle cx="24" cy="16" r="5" fill="#25E0C5" filter="url(#softGlow)"/>
    <text x="42" y="21" fill="#D6FFF8" font-family="Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.8">
      OPEN TO BUILD
    </text>
  </g>
  <path d="M86 220H660" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
  <text x="86" y="156" fill="#F5F7FA" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="0">
