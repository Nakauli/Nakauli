<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Activity loop visualization</title>
  <desc id="desc">A compact animated contribution-style loop showing steady practice, review, and shipping.</desc>
  <defs>
    <style>
      .spark { animation: spark 3.6s ease-in-out infinite; }
      .spark:nth-child(2) { animation-delay: .4s; }
      .spark:nth-child(3) { animation-delay: .8s; }
      .spark:nth-child(4) { animation-delay: 1.2s; }
      @keyframes spark { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
    <linearGradient id="loopBg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071019"/>
      <stop offset="1" stop-color="#0B1722"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="22" fill="url(#loopBg)"/>
  <text x="56" y="62" fill="#25E0C5" font-family="Consolas, monospace" font-size="17" font-weight="700" letter-spacing="2">
    ACTIVITY LOOP
  </text>
  <text x="56" y="94" fill="#DCEFFF" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">
    practice daily, review honestly, ship small improvements
  </text>
  <g transform="translate(58 134)" fill="#152230">
    <rect width="16" height="16" rx="4"/><rect x="24" width="16" height="16" rx="4"/><rect x="48" width="16" height="16" rx="4"/><rect x="72" width="16" height="16" rx="4"/><rect x="96" width="16" height="16" rx="4"/><rect x="120" width="16" height="16" rx="4"/>
    <rect x="144" width="16" height="16" rx="4"/><rect x="168" width="16" height="16" rx="4"/><rect x="192" width="16" height="16" rx="4"/><rect x="216" width="16" height="16" rx="4"/><rect x="240" width="16" height="16" rx="4"/><rect x="264" width="16" height="16" rx="4"/>
    <rect x="288" width="16" height="16" rx="4"/><rect x="312" width="16" height="16" rx="4"/><rect x="336" width="16" height="16" rx="4"/><rect x="360" width="16" height="16" rx="4"/><rect x="384" width="16" height="16" rx="4"/><rect x="408" width="16" height="16" rx="4"/>
    <rect x="432" width="16" height="16" rx="4"/><rect x="456" width="16" height="16" rx="4"/><rect x="480" width="16" height="16" rx="4"/><rect x="504" width="16" height="16" rx="4"/><rect x="528" width="16" height="16" rx="4"/><rect x="552" width="16" height="16" rx="4"/>
  </g>
  <g transform="translate(58 134)">
    <rect class="spark" x="48" width="16" height="16" rx="4" fill="#25E0C5"/>
    <rect class="spark" x="216" width="16" height="16" rx="4" fill="#34B8FF"/>
    <rect class="spark" x="384" width="16" height="16" rx="4" fill="#F5A524"/>
    <rect class="spark" x="504" width="16" height="16" rx="4" fill="#25E0C5"/>
  </g>
  <g transform="translate(58 188)">
    <rect width="600" height="14" rx="7" fill="#12202D"/>
    <rect width="180" height="14" rx="7" fill="#25E0C5" opacity="0.72"/>
    <rect x="180" width="170" height="14" fill="#34B8FF" opacity="0.72"/>
    <rect x="350" width="150" height="14" fill="#F5A524" opacity="0.8"/>
    <rect x="500" width="100" height="14" rx="7" fill="#25E0C5"/>
  </g>
  <text x="58" y="226" fill="#8FB7C8" font-family="Consolas, monospace" font-size="14">
    practice -> test -> document -> improve
  </text>
  <g transform="translate(820 128)" font-family="Consolas, monospace" font-size="15" font-weight="700">
    <rect width="290" height="76" rx="16" fill="#0A1A26" stroke="#254D61"/>
    <text x="26" y="34" fill="#DCEFFF">current loop</text>
    <text x="26" y="58" fill="#25E0C5">Java reps + API builds</text>
  </g>
</svg>
